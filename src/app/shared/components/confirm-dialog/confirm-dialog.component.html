@if (open()) {
  <div
    class="confirm-dialog"
    role="dialog"
    aria-modal="true"
    [attr.aria-labelledby]="'confirm-dialog-title'"
    (click)="onBackdropClick($event)"
  >
    <div class="confirm-dialog__panel">
      <div
        class="confirm-dialog__icon"
        [class.confirm-dialog__icon--danger]="variant() === 'danger'"
        [class.confirm-dialog__icon--default]="variant() === 'default'"
        aria-hidden="true"
      >
        @if (variant() === 'danger') {
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v4m0 4h.01M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z" />
          </svg>
        } @else {
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M8.228 9c.549-1.165 2.03-2 3.772-2 2.21 0 4 1.343 4 3 0 1.4-1.278 2.575-3.006 2.907-.542.104-.994.54-.994 1.093m0 3h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
          </svg>
        }
      </div>

      <h2 id="confirm-dialog-title" class="confirm-dialog__title">{{ title() }}</h2>

      @if (message()) {
        <p class="confirm-dialog__message">{{ message() }}</p>
      }

      @if (highlight()) {
        <p class="confirm-dialog__highlight">{{ highlight() }}</p>
      }

      <div class="confirm-dialog__actions">
        <button type="button" class="btn btn--outline" [disabled]="loading()" (click)="onCancel()">
          {{ cancelLabel() }}
        </button>
        <button
          type="button"
          class="btn"
          [class.btn--danger-solid]="variant() === 'danger'"
          [class.btn--primary]="variant() === 'default'"
          [disabled]="loading()"
          (click)="onConfirm()"
        >
          @if (loading()) {
            Procesando…
          } @else {
            {{ confirmLabel() }}
          }
        </button>
      </div>
    </div>
  </div>
}
