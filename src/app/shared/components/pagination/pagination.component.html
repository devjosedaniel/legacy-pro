@if (total() > 0) {
  <nav class="pagination" aria-label="Paginación">
    <p class="pagination__summary">
      Mostrando
      <span class="pagination__range">{{ formatNumber(rangeStart()) }}–{{ formatNumber(rangeEnd()) }}</span>
      de
      <strong>{{ formatNumber(total()) }}</strong>
      @if (itemLabel()) {
        {{ itemLabel() }}
      }
    </p>

    <div class="pagination__controls">
      @if (showFirstLast()) {
        <button
          type="button"
          class="pagination__btn"
          aria-label="Primera página"
          [disabled]="disabled() || page() <= 1"
          (click)="goTo(1)"
        >
          <svg viewBox="0 0 20 20" fill="currentColor" width="16" height="16" aria-hidden="true">
            <path
              fill-rule="evenodd"
              d="M15.707 15.707a1 1 0 01-1.414 0l-5-5a1 1 0 010-1.414l5-5a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 010 1.414zm-6 0a1 1 0 01-1.414 0l-5-5a1 1 0 010-1.414l5-5a1 1 0 011.414 1.414L5.414 10l4.293 4.293a1 1 0 010 1.414z"
              clip-rule="evenodd"
            />
          </svg>
        </button>
      }

      <button
        type="button"
        class="pagination__btn"
        aria-label="Página anterior"
        [disabled]="disabled() || page() <= 1"
        (click)="goTo(page() - 1)"
      >
        <svg viewBox="0 0 20 20" fill="currentColor" width="16" height="16" aria-hidden="true">
          <path
            fill-rule="evenodd"
            d="M12.707 5.293a1 1 0 010 1.414L9.414 10l3.293 3.293a1 1 0 01-1.414 1.414l-4-4a1 1 0 010-1.414l4-4a1 1 0 011.414 0z"
            clip-rule="evenodd"
          />
        </svg>
      </button>

      <div class="pagination__page-indicator" aria-live="polite">
        <span class="pagination__page-label">Página</span>
        <span class="pagination__page-current">{{ formatNumber(page()) }}</span>
        <span class="pagination__page-sep">/</span>
        <span class="pagination__page-total">{{ formatNumber(totalPages()) }}</span>
      </div>

      <button
        type="button"
        class="pagination__btn"
        aria-label="Página siguiente"
        [disabled]="disabled() || page() >= totalPages()"
        (click)="goTo(page() + 1)"
      >
        <svg viewBox="0 0 20 20" fill="currentColor" width="16" height="16" aria-hidden="true">
          <path
            fill-rule="evenodd"
            d="M7.293 14.707a1 1 0 010-1.414L10.586 10 7.293 6.707a1 1 0 011.414-1.414l4 4a1 1 0 010 1.414l-4 4a1 1 0 01-1.414 0z"
            clip-rule="evenodd"
          />
        </svg>
      </button>

      @if (showFirstLast()) {
        <button
          type="button"
          class="pagination__btn"
          aria-label="Última página"
          [disabled]="disabled() || page() >= totalPages()"
          (click)="goTo(totalPages())"
        >
          <svg viewBox="0 0 20 20" fill="currentColor" width="16" height="16" aria-hidden="true">
            <path
              fill-rule="evenodd"
              d="M4.293 4.293a1 1 0 011.414 0l5 5a1 1 0 010 1.414l-5 5a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414zm6 0a1 1 0 011.414 0l5 5a1 1 0 010 1.414l-5 5a1 1 0 11-1.414-1.414L14.586 10l-4.293-4.293a1 1 0 010-1.414z"
              clip-rule="evenodd"
            />
          </svg>
        </button>
      }
    </div>
  </nav>
}
